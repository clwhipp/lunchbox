[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "schoolcafe-family"
version = "1.0.0"
description = "A weekly school lunch planner with local food preferences"
requires-python = ">=3.13"
dependencies = [
  "Django>=5.2.8,<5.3",
  "django-htmx>=1.23,<2",
  "gunicorn>=23,<24",
  "whitenoise>=6.9,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-django>=4.11,<5", "pytest-cov>=7,<8", "pytest-playwright>=0.7,<1", "ruff>=0.14,<1", "mypy>=1.18,<2"]

[tool.setuptools.packages.find]
include = ["schoolmenu*"]

[tool.setuptools.package-data]
schoolmenu = ["templates/**/*.html", "static/**/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
addopts = "-ra"
markers = ["e2e: browser tests", "docker: deployment acceptance tests"]

[tool.coverage.run]
branch = true
source = ["schoolmenu"]
omit = ["*/migrations/*", "*/wsgi.py"]

[tool.coverage.report]
fail_under = 96
precision = 2
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["/migrations/"]
