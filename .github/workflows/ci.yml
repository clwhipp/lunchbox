name: Application checks
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref to validate; defaults to the triggering ref.
        required: false
        type: string

permissions:
  contents: read

jobs:
  workflows:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - name: Check workflow syntax and expressions
        run: >-
          docker run --rm
          --volume "${GITHUB_WORKSPACE}/.github:/work/.github:ro"
          --workdir /work
          rhysd/actionlint:1.7.12 -color
          .github/workflows/ci.yml .github/workflows/publish.yml
  python:
    needs: workflows
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
          cache: pip
          cache-dependency-path: 'requirements*.lock'
      - run: pip install -r requirements-dev.lock
      - run: ruff check schoolmenu tests scripts manage.py schoolcafe_client.py
      - run: ruff format --check schoolmenu tests scripts manage.py schoolcafe_client.py
      - run: mypy schoolmenu
      - run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: tests.settings
      - run: pytest tests/unit tests/integration --cov=schoolmenu --cov-branch --cov-report=xml --cov-report=json
      - run: python scripts/check_coverage.py coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ matrix.python-version }}
          path: |
            coverage.json
            coverage.xml
  browser:
    needs: workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements-dev.lock
      - run: npm ci
      - run: npm run format:check
      - run: npm run test:coverage
      - run: playwright install --with-deps chromium
      - run: pytest tests/e2e --tracing=retain-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            artifacts/
            test-results/
            coverage/
  docker:
    needs: workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - run: cp .env.example .env
      - run: docker compose build
      - run: python3 scripts/docker_smoke.py
      - run: docker build --target test -t lunchbox:test .
      - run: docker run --rm lunchbox:test sh -c 'pytest tests/unit tests/integration --cov=schoolmenu --cov-branch --cov-report=json && python scripts/check_coverage.py coverage.json'
