services:
  web:
    build:
      context: .
      target: runtime
    image: "${LUNCHBOX_IMAGE:-lunchbox:local}"
    env_file: .env
    environment:
      DATABASE_PATH: /data/schoolcafe.sqlite3
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:8000"
    volumes:
      - schoolcafe_data:/data
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
volumes:
  schoolcafe_data:
